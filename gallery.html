  <body>
    <div class="hero_area">
      <!-- header section strats -->

        <div class="header_top">

              <a href="#" class="logo-link"
                ><img src="./images/logo.png" alt="" class="logo-img"
              /></a>
            </div>
          </div>
        </div>
        <div class="header_bottom">
          <div class="container-fluid">
            <nav class="navbar navbar-expand-lg custom_nav-container">
              <a class="navbar-brand" href="index.html">
                <span> Inance </span>
              </a>

              <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class=""> </span>
              </button>

              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link" href="index.html"
                      >Home <span class="sr-only">(current)</span></a
                    >

                  <li class="nav-item active">
                    <a class="nav-link" href="gallery.html">Gallery</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="service.html">Services</a>

                  <li class="nav-item">

                  </li>
                </ul>
              </div>
            </nav>
          </div>
        </div>
      </header>
      <!-- end header section -->
    </div>

    <!-- gallery section -->

    <section class="gallery_section layout_padding">
      <div class="container">
        <div class="heading_container">
          <h2>Our Work</h2>
          <p>
            A selection of recent joinery, decking and flooring projects.
          </p>
        </div>

        <div class="g-carousel" id="gCarousel">
          <div class="g-filters" role="group" aria-label="Filter by category"></div>
          <div class="g-stage">
            <div class="g-stage__bg"></div>
            <img class="g-stage__img" src="" alt="" />
            <button
              type="button"
              class="g-arrow g-arrow--prev"
              aria-label="Previous photo"
            >
              <i class="fa fa-chevron-left" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="g-arrow g-arrow--next"
              aria-label="Next photo"
            >
              <i class="fa fa-chevron-right" aria-hidden="true"></i>
            </button>
            <div class="g-counter" aria-live="polite"></div>
          </div>

          <div class="g-caption" aria-live="polite">
            <span class="g-caption__tag"></span>
            <h3 class="g-caption__title"></h3>
            <p class="g-caption__text"></p>
          </div>

          <div class="g-thumbs"></div>
        </div>
      </div>
    </section>

    <div class="g-lightbox" id="gLightbox" role="dialog" aria-label="Enlarged photo">
      <button type="button" class="g-lightbox__close" aria-label="Close">&times;</button>
      <img src="" alt="" />
    </div>

    <!-- end gallery section -->

    <!-- info section -->

      <div class="container">

        <div class="row">

                      </div>
                      <a>Canning Town</a>
                    </div>
                  </a>
                </div>
                <div class="col-md-4">
                  <a href="">
                    <div class="item">
                      <div class="img-box">
                        <i class="fa fa-phone" aria-hidden="true"></i>
                      </div>
                      <a href="07448219217">07448219217</a>
                    </div>
                  </a>
                </div>
                <div class="col-md-4">
                  <a href="">
                    <div class="item">
                      <div class="img-box">
                        <i class="fa fa-envelope" aria-hidden="true"></i>
                      </div>
                      <a href="kapustafix@gmail.com">kapustafix@gmail.com</a>
                    </div>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="social-box">
        <h4>Follow Us</h4>
        <div class="box">
          <a href="">
            <i class="fa fa-facebook" aria-hidden="true"></i>
          </a>
          <a href="">
            <i class="fa fa-twitter" aria-hidden="true"></i>
          </a>
          <a href="">
            <i class="fa fa-youtube" aria-hidden="true"></i>
          </a>
          <a href="">
            <i class="fa fa-instagram" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </section>

    <!-- end info_section -->

        <p>

    <script src="js/custom.js"></script>
